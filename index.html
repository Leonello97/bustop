<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transperth Split-Flap Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0e14;
      color: #e0e6ed;
      font-family: 'Courier New', Courier, monospace;
      padding: 12px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      user-select: none;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #121721;
      border: 2px solid #21262d;
      border-radius: 8px;
      padding: 8px 16px;
      margin-bottom: 10px;
    }
    
    .weather-box {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 250px;
    }
    .weather-box.right {
      justify-content: flex-end;
      text-align: right;
    }
    .weather-icon {
      font-size: 1.8rem;
    }
    .weather-info {
      display: flex;
      flex-direction: column;
    }
    .weather-label {
      font-size: 0.65rem;
      color: #8b949e;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .weather-val {
      font-size: 0.95rem;
      font-weight: bold;
      color: #58a6ff;
    }

    .header-center {
      text-align: center;
    }
    .clock {
      font-size: 2.2rem;
      font-weight: bold;
      color: #f5a623;
      letter-spacing: 2px;
      text-shadow: 0 0 4px rgba(245, 166, 35, 0.3);
    }
    .date {
      font-size: 0.85rem;
      color: #8b949e;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* PANELS */
    .board-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-grow: 1;
    }

    .panel {
      background: #11141a;
      border: 2px solid #1c2128;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
    }

    .panel-inbound { flex: 1; }
    .panel-outbound { flex: 1.3; }

    .panel-title {
      font-size: 0.9rem;
      font-weight: bold;
      color: #8b949e;
      margin-bottom: 8px;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
    }

    /* TABLES & ALIGNMENT */
    .display-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 6px;
    }

    .display-table th {
      text-align: left;
      font-size: 0.7rem;
      color: #6e7681;
      padding-bottom: 2px;
      letter-spacing: 1px;
    }

    .display-row {
      background: #161b22;
      border-radius: 5px;
      padding: 2px 0;
    }

    /* EVIDENZIAZIONE ROSSA SOLTANTO PER INBOUND <= 10 MINUTI */
    .display-row.inbound-warning {
      background: #3c1218 !important;
      border: 1px solid #da3633 !important;
      box-shadow: 0 0 8px rgba(218, 54, 51, 0.4);
    }
    .display-row.inbound-warning .tile-char {
      background: #5a1d22 !important;
      color: #ff7b72 !important;
      border-color: #8e292d !important;
    }

    /* TESSERE GIREVOLI (SPLIT-FLAP) */
    .tile-group {
      display: inline-flex;
      gap: 2px;
    }

    .tile-char {
      position: relative;
      background: #1c2128;
      color: #f5a623;
      font-size: 1.15rem;
      font-weight: 800;
      width: 20px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      border: 1px solid #30363d;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 2px 3px rgba(0,0,0,0.6);
      perspective: 400px;
    }

    .tile-char::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      background: rgba(0, 0, 0, 0.7);
    }

    /* Animazione Flap ogni 30 secondi */
    .tile-char.flipping {
      animation: flipTile 0.5s ease-in-out;
    }

    @keyframes flipTile {
      0% { transform: rotateX(0deg); }
      50% { transform: rotateX(-90deg); background: #0e1117; }
      100% { transform: rotateX(0deg); }
    }

    .tile-blue {
      color: #58a6ff;
    }

    /* LARGHEZZE COLONNE SERRATE SENZA SPAZI VUOTI CORRIDOIO */
    .col-route { width: 10%; }
    .col-dest  { width: 38%; }
    .col-dep   { width: 18%; }
    .col-arr   { width: 18%; }
    .col-eta   { width: 16%; text-align: right; }

  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="weather-box">
      <div class="weather-icon" id="weather-left-icon">🌙</div>
      <div class="weather-info">
        <span class="weather-label" id="weather-left-title">PERTH EVENING</span>
        <span class="weather-val" id="weather-left-val">17°C • CLEAR NIGHT</span>
      </div>
    </div>

    <div class="header-center">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="date">--- -- --- ----</div>
    </div>

    <div class="weather-box right">
      <div class="weather-info">
        <span class="weather-label" id="weather-right-title" style="color: #f5a623;">TOMORROW MORNING</span>
        <span class="weather-val" id="weather-right-val" style="color: #f5a623;">15°C • MILD AM</span>
      </div>
      <div class="weather-icon" id="weather-right-icon">⛅</div>
    </div>
  </div>

  <!-- MAIN BOARDS -->
  <div class="board-container">
    
    <!-- INBOUND PANEL (Solo 970 e 970X) -->
    <div class="panel panel-inbound">
      <div class="panel-title">
        <span>INBOUND / STOP 16812 (WILUNA ST)</span>
        <span style="color: #58a6ff;">TO PERTH BUSPORT</span>
      </div>
      <table class="display-table">
        <thead>
          <tr>
            <th class="col-route">BUS</th>
            <th class="col-dest">DESTINATION</th>
            <th class="col-dep">PARTENZA</th>
            <th class="col-arr">ARRIVO BUSPORT</th>
            <th class="col-eta" style="text-align: right;">ATTESA</th>
          </tr>
        </thead>
        <tbody id="inbound-body"></tbody>
      </table>
    </div>

    <!-- OUTBOUND PANEL -->
    <div class="panel panel-outbound">
      <div class="panel-title">
        <span>OUTBOUND / FROM PERTH BUSPORT</span>
        <span style="color: #8b949e;">TO HOME (16813 / 12355)</span>
      </div>
      <table class="display-table">
        <thead>
          <tr>
            <th class="col-route">BUS</th>
            <th class="col-dest">DESTINATION</th>
            <th class="col-dep">PARTENZA</th>
            <th class="col-eta" style="text-align: right;">ATTESA</th>
          </tr>
        </thead>
        <tbody id="outbound-body"></tbody>
      </table>
    </div>

  </div>

  <script>
    // --- TIMETABLES DI TRANSPERTH (INBOUND 970/970X & OUTBOUND MULTI) ---
    const inboundSchedules = [
      "05:15", "05:45", "06:12", "06:32", "06:52", "07:12", "07:27", "07:42", "07:57",
      "08:12", "08:27", "08:42", "08:57", "09:12", "09:27", "09:42", "10:00",
      "10:15", "10:30", "10:45", "11:00", "11:15", "11:30", "11:45", "12:00",
      "12:15", "12:30", "12:45", "13:00", "13:15", "13:30", "13:45", "14:00",
      "14:15", "14:30", "14:45", "15:00", "15:15", "15:30", "15:45", "16:00",
      "16:15", "16:30", "16:45", "17:00", "17:15", "17:30", "17:45", "18:00",
      "18:20", "18:40", "19:00", "19:30", "20:00", "20:30", "21:30", "22:30", "23:35"
    ];

    const outboundSchedules = [
      { route: "970", time: "06:00" }, { route: "389", time: "06:15" },
      { route: "386", time: "06:30" }, { route: "970", time: "06:45" },
      { route: "388", time: "07:00" }, { route: "384", time: "07:15" },
      { route: "970", time: "07:30" }, { route: "389", time: "07:45" },
      { route: "386", time: "08:00" }, { route: "970", time: "08:15" },
      { route: "388", time: "08:30" }, { route: "384", time: "08:45" },
      { route: "970", time: "09:00" }, { route: "389", time: "09:15" },
      { route: "386", time: "09:30" }, { route: "970", time: "09:45" },
      { route: "388", time: "10:00" }, { route: "970", time: "10:15" },
      { route: "384", time: "10:30" }, { route: "970", time: "10:45" },
      { route: "389", time: "11:00" }, { route: "970", time: "11:15" },
      { route: "386", time: "11:30" }, { route: "970", time: "11:45" },
      { route: "388", time: "12:00" }, { route: "970", time: "12:15" },
      { route: "384", time: "12:30" }, { route: "970", time: "12:45" },
      { route: "389", time: "13:00" }, { route: "970", time: "13:15" },
      { route: "386", time: "13:30" }, { route: "970", time: "13:45" },
      { route: "388", time: "14:00" }, { route: "970", time: "14:15" },
      { route: "384", time: "14:30" }, { route: "970", time: "14:45" },
      { route: "389", time: "15:00" }, { route: "970", time: "15:15" },
      { route: "386", time: "15:30" }, { route: "970", time: "15:45" },
      { route: "388", time: "16:00" }, { route: "970", time: "16:15" },
      { route: "384", time: "16:30" }, { route: "970", time: "16:45" },
      { route: "389", time: "17:00" }, { route: "970", time: "17:15" },
      { route: "386", time: "17:30" }, { route: "970", time: "17:45" },
      { route: "388", time: "18:00" }, { route: "970", time: "18:15" },
      { route: "384", time: "18:30" }, { route: "970", time: "18:45" },
      { route: "389", time: "19:00" }, { route: "970", time: "19:30" },
      { route: "386", time: "20:00" }, { route: "970", time: "20:30" },
      { route: "388", time: "21:00" }, { route: "970", time: "21:30" },
      { route: "386", time: "22:00" }, { route: "970", time: "22:30" },
      { route: "970", time: "23:05" }, { route: "389", time: "23:15" },
      { route: "970", time: "23:30" }, { route: "386", time: "23:45" }
    ];

    let triggerFlipAnimation = false;

    // Crea tessere girevoli senza tessere vuote in eccesso
    function createSplitTile(text, isBlue = false) {
      const container = document.createElement('div');
      container.className = 'tile-group';
      
      text.toString().split('').forEach(char => {
        const tile = document.createElement('div');
        tile.className = `tile-char ${isBlue ? 'tile-blue' : ''} ${triggerFlipAnimation ? 'flipping' : ''}`;
        tile.textContent = char;
        container.appendChild(tile);
      });
      return container;
    }

    // Calcola l'orario di arrivo stimato (+11 minuti di percorrenza)
    function calculateArrival(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      let totalMins = h * 60 + m + 11;
      let arrH = Math.floor(totalMins / 60) % 24;
      let arrM = totalMins % 60;
      return `${String(arrH).padStart(2, '0')}:${String(arrM).padStart(2, '0')}`;
    }

    function updateHeaderAndWeather() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

      // Giorno per esteso in Inglese (es. SUNDAY, 25 OCT 2026)
      const options = { weekday: 'long', day: '2-digit', month: 'short', year: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('en-GB', options).toUpperCase();

      // LOGICA METEO DINAMICA (Mattina/Sera -> Prossima Fascia)
      const isAM = now.getHours() < 12;

      if (isAM) {
        document.getElementById('weather-left-icon').textContent = "☀️";
        document.getElementById('weather-left-title').textContent = "PERTH MORNING";
        document.getElementById('weather-left-val').textContent = "22°C • SUNNY";

        document.getElementById('weather-right-icon').textContent = "🌙";
        document.getElementById('weather-right-title').textContent = "PERTH EVENING";
        document.getElementById('weather-right-val').textContent = "17°C • CLEAR";
      } else {
        document.getElementById('weather-left-icon').textContent = "🌙";
        document.getElementById('weather-left-title').textContent = "PERTH EVENING";
        document.getElementById('weather-left-val').textContent = "17°C • CLEAR NIGHT";

        document.getElementById('weather-right-icon').textContent = "⛅";
        document.getElementById('weather-right-title').textContent = "TOMORROW MORNING";
        document.getElementById('weather-right-val').textContent = "15°C • MILD AM";
      }
    }

    function renderTables() {
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      // INBOUND RENDER (Mostra solo 970 / 970X con Proiezione Giorno Successivo se terminati)
      const inboundBody = document.getElementById('inbound-body');
      inboundBody.innerHTML = '';

      let upcomingInbound = inboundSchedules.map(timeStr => {
        const [h, m] = timeStr.split(':').map(Number);
        const busMinutes = h * 60 + m;
        return { timeStr, diff: busMinutes - currentMinutes, isTomorrow: false };
      }).filter(item => item.diff >= 0);

      // Se non ci sono più bus oggi, proietta quelli di domani mattina
      if (upcomingInbound.length === 0) {
        upcomingInbound = inboundSchedules.slice(0, 3).map(timeStr => {
          const [h, m] = timeStr.split(':').map(Number);
          const busMinutes = (24 * 60) + (h * 60 + m);
          return { timeStr, diff: busMinutes - currentMinutes, isTomorrow: true };
        });
      }

      upcomingInbound.slice(0, 3).forEach((item, index) => {
        const row = document.createElement('tr');
        row.className = 'display-row';

        // EVIDENZIAZIONE ROSSA SOLTANTO SULLA PRIMA RIGA INBOUND SE <= 10 MIN
        if (index === 0 && item.diff <= 10 && !item.isTomorrow) {
          row.classList.add('inbound-warning');
        }

        const tdRoute = document.createElement('td');
        tdRoute.appendChild(createSplitTile("970", true));

        const tdDest = document.createElement('td');
        tdDest.appendChild(createSplitTile("PERTH BUSPORT"));

        const tdDep = document.createElement('td');
        tdDep.appendChild(createSplitTile(item.timeStr));

        const tdArr = document.createElement('td');
        tdArr.appendChild(createSplitTile(calculateArrival(item.timeStr)));

        const tdEta = document.createElement('td');
        tdEta.style.textAlign = 'right';
        
        let etaText = item.diff >= 60 ? `${Math.floor(item.diff/60)}h ${item.diff%60}m` : `${item.diff}m`;
        tdEta.appendChild(createSplitTile(etaText));

        row.appendChild(tdRoute);
        row.appendChild(tdDest);
        row.appendChild(tdDep);
        row.appendChild(tdArr);
        row.appendChild(tdEta);
        inboundBody.appendChild(row);
      });

      // OUTBOUND RENDER (Destinazione HOME per 970 e DOG SWAMP per gli altri)
      const outboundBody = document.getElementById('outbound-body');
      outboundBody.innerHTML = '';

      let upcomingOutbound = outboundSchedules.map(item => {
        const [h, m] = item.time.split(':').map(Number);
        const busMinutes = h * 60 + m;
        return { ...item, diff: busMinutes - currentMinutes, isTomorrow: false };
      }).filter(item => item.diff >= 0);

      // Se non ci sono più bus stasera, proietta quelli di domani mattina
      if (upcomingOutbound.length === 0) {
        upcomingOutbound = outboundSchedules.slice(0, 3).map(item => {
          const [h, m] = item.time.split(':').map(Number);
          const busMinutes = (24 * 60) + (h * 60 + m);
          return { ...item, diff: busMinutes - currentMinutes, isTomorrow: true };
        });
      }

      upcomingOutbound.slice(0, 3).forEach((item) => {
        const row = document.createElement('tr');
        row.className = 'display-row';

        const tdRoute = document.createElement('td');
        tdRoute.appendChild(createSplitTile(item.route, true));

        const tdDest = document.createElement('td');
        // Allineamento rigido: HOME viene riempito con tessere vuote fino a 9 caratteri (uguale a DOG SWAMP)
        let destText = (item.route === "970" || item.route === "970X") ? "HOME     " : "DOG SWAMP";
        tdDest.appendChild(createSplitTile(destText));

        const tdDep = document.createElement('td');
        tdDep.appendChild(createSplitTile(item.time));

        const tdEta = document.createElement('td');
        tdEta.style.textAlign = 'right';
        
        let etaText = item.diff >= 60 ? `${Math.floor(item.diff/60)}h ${item.diff%60}m` : `${item.diff}m`;
        tdEta.appendChild(createSplitTile(etaText));

        row.appendChild(tdRoute);
        row.appendChild(tdDest);
        row.appendChild(tdDep);
        row.appendChild(tdEta);
        outboundBody.appendChild(row);
      });

      // Resetta il flag dell'animazione
      triggerFlipAnimation = false;
    }

    // Timer animazione rotazione tessere ogni 30 secondi
    setInterval(() => {
      triggerFlipAnimation = true;
    }, 30000);

    // Loop principale di aggiornamento ogni secondo
    setInterval(() => {
      updateHeaderAndWeather();
      renderTables();
    }, 1000);

    updateHeaderAndWeather();
    renderTables();
  </script>
</body>
</html>
