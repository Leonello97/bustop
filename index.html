<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- TAGS PER APERTURA A SCHERMO INTERO REALE SU IPAD / SAFARI -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Transperth Dashboard">

  <title>Transperth Split-Flap Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0e14;
      color: #e0e6ed;
      font-family: 'Courier New', Courier, monospace;
      padding: 10px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      user-select: none;
    }

    /* HEADER A 4 BLOCCHI COMPATTO PER RIENTRARE NEI MARGINI */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #121721;
      border: 2px solid #21262d;
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 8px;
      width: 100%;
    }
    
    .header-group {
      display: flex;
      gap: 6px;
    }

    .weather-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 4px 8px;
      width: 150px;
    }
    .weather-box.right {
      justify-content: flex-end;
      text-align: right;
    }
    .weather-icon {
      font-size: 1.4rem;
    }
    .weather-info {
      display: flex;
      flex-direction: column;
    }
    .weather-label {
      font-size: 0.55rem;
      color: #8b949e;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    .weather-val {
      font-size: 0.76rem;
      font-weight: bold;
      color: #58a6ff;
    }

    .header-center {
      text-align: center;
      padding: 0 6px;
    }
    .clock {
      font-size: 2.1rem;
      font-weight: bold;
      color: #f5a623;
      letter-spacing: 2px;
      text-shadow: 0 0 5px rgba(245, 166, 35, 0.3);
    }
    .date {
      font-size: 0.78rem;
      color: #8b949e;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 1px;
    }

    /* PANELS */
    .board-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-grow: 1;
    }

    .panel {
      background: #11141a;
      border: 2px solid #1c2128;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
    }

    .panel-inbound { flex: 1.8; }
    .panel-outbound { flex: 1.2; }

    .panel-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #8b949e;
      margin-bottom: 6px;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
    }

    /* TABLES & ALIGNMENT PERFETTO */
    .display-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 6px;
      table-layout: fixed;
    }

    .display-table th {
      text-align: left;
      font-size: 0.75rem;
      color: #6e7681;
      padding-bottom: 2px;
      letter-spacing: 1px;
    }

    .display-row {
      background: #161b22;
      border-radius: 6px;
      padding: 2px 0;
    }

    .display-row.inbound-warning {
      background: #3c1218 !important;
      border: 1px solid #da3633 !important;
      box-shadow: 0 0 8px rgba(218, 54, 51, 0.4);
    }
    .display-row.inbound-warning .tile-char {
      background: #5a1d22 !important;
      color: #ff7b72 !important;
      border-color: #8e292d !important;
    }

    /* TESSERE GIREVOLI */
    .tile-group {
      display: inline-flex;
      gap: 3px;
    }

    .tile-char {
      position: relative;
      background: #1c2128;
      color: #f5a623;
      font-size: 1.35rem;
      font-weight: 800;
      width: 23px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      border: 1px solid #30363d;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.6);
      perspective: 400px;
    }

    .tile-char::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      background: rgba(0, 0, 0, 0.7);
    }

    .tile-char.flipping {
      animation: flipTile 0.5s ease-in-out;
    }

    @keyframes flipTile {
      0% { transform: rotateX(0deg); }
      50% { transform: rotateX(-90deg); background: #0e1117; }
      100% { transform: rotateX(0deg); }
    }

    .tile-blue {
      color: #58a6ff;
    }

    /* LARGHEZZE COLONNE IDENTICHE PER ENTRAMBI I TABELLONI */
    .col-route { width: 12%; }
    .col-dest  { width: 36%; }
    .col-dep   { width: 18%; }
    .col-arr   { width: 16%; }
    .col-eta   { width: 18%; text-align: right; }

  </style>
</head>
<body>

  <!-- HEADER A 4 BLOCCHI METEO -->
  <div class="header">
    <div class="header-group">
      <div class="weather-box" id="wbox-0">
        <div class="weather-icon" id="wicon-0">☀️</div>
        <div class="weather-info">
          <span class="weather-label" id="wlabel-0">NIGHT</span>
          <span class="weather-val" id="wval-0">--°C</span>
        </div>
      </div>
      <div class="weather-box" id="wbox-1">
        <div class="weather-icon" id="wicon-1">🌤️</div>
        <div class="weather-info">
          <span class="weather-label" id="wlabel-1">MORNING</span>
          <span class="weather-val" id="wval-1">--°C</span>
        </div>
      </div>
    </div>

    <div class="header-center">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="date">--- -- --- ----</div>
    </div>

    <div class="header-group">
      <div class="weather-box right" id="wbox-2">
        <div class="weather-info">
          <span class="weather-label" id="wlabel-2">AFTERNOON</span>
          <span class="weather-val" id="wval-2">--°C</span>
        </div>
        <div class="weather-icon" id="wicon-2">☀️</div>
      </div>
      <div class="weather-box right" id="wbox-3">
        <div class="weather-info">
          <span class="weather-label" id="wlabel-3" style="color: #f5a623;">EVENING</span>
          <span class="weather-val" id="wval-3" style="color: #f5a623;">--°C</span>
        </div>
        <div class="weather-icon" id="wicon-3">🌙</div>
      </div>
    </div>
  </div>

  <!-- MAIN BOARDS -->
  <div class="board-container">
    
    <div class="panel panel-inbound">
      <div class="panel-title">
        <span>FROM WILUNA ST</span>
        <span style="color: #58a6ff;">TO PERTH BUSPORT</span>
      </div>
      <table class="display-table">
        <thead>
          <tr>
            <th class="col-route">BUS</th>
            <th class="col-dest">DESTINATION</th>
            <th class="col-dep">PARTENZA</th>
            <th class="col-arr">ARRIVO BUSPORT</th>
            <th class="col-eta" style="text-align: right;">ATTESA</th>
          </tr>
        </thead>
        <tbody id="inbound-body"></tbody>
      </table>
    </div>

    <div class="panel panel-outbound">
      <div class="panel-title">
        <span>FROM PERTH BUSPORT</span>
        <span style="color: #8b949e;">TO HOME</span>
      </div>
      <table class="display-table">
        <thead>
          <tr>
            <th class="col-route">BUS</th>
            <th class="col-dest">DESTINATION</th>
            <th class="col-dep">PARTENZA</th>
            <th class="col-arr" style="visibility: hidden;">ARRIVO BUSPORT</th>
            <th class="col-eta" style="text-align: right;">ATTESA</th>
          </tr>
        </thead>
        <tbody id="outbound-body"></tbody>
      </table>
    </div>

  </div>

  <script>
    const inboundSchedules = [
      "05:15", "05:45", "06:12", "06:32", "06:52", "07:12", "07:27", "07:42", "07:57",
      "08:12", "08:27", "08:42", "08:57", "09:12", "09:27", "09:42", "10:00",
      "10:15", "10:30", "10:45", "11:00", "11:15", "11:30", "11:45", "12:00",
      "12:15", "12:30", "12:45", "13:00", "13:15", "13:30", "13:45", "14:00",
      "14:15", "14:30", "14:45", "15:00", "15:15", "15:30", "15:45", "16:00",
      "16:15", "16:30", "16:45", "17:00", "17:15", "17:30", "17:45", "18:00",
      "18:20", "18:40", "19:00", "19:30", "20:00", "20:30", "21:30", "22:30", "23:35"
    ];

    const outboundSchedules = [
      { route: "970", time: "06:00" }, { route: "389", time: "06:15" },
      { route: "386", time: "06:30" }, { route: "970", time: "06:45" },
      { route: "388", time: "07:00" }, { route: "384", time: "07:15" },
      { route: "970", time: "07:30" }, { route: "389", time: "07:45" },
      { route: "386", time: "08:00" }, { route: "970", time: "08:15" },
      { route: "388", time: "08:30" }, { route: "384", time: "08:45" },
      { route: "970", time: "09:00" }, { route: "389", time: "09:15" },
      { route: "386", time: "09:30" }, { route: "970", time: "09:45" },
      { route: "388", time: "10:00" }, { route: "970", time: "10:15" },
      { route: "384", time: "10:30" }, { route: "970", time: "10:45" },
      { route: "389", time: "11:00" }, { route: "970", time: "11:15" },
      { route: "386", time: "11:30" }, { route: "970", time: "11:45" },
      { route: "388", time: "12:00" }, { route: "970", time: "12:15" },
      { route: "384", time: "12:30" }, { route: "970", time: "12:45" },
      { route: "389", time: "13:00" }, { route: "970", time: "13:15" },
      { route: "386", time: "13:30" }, { route: "970", time: "13:45" },
      { route: "388", time: "14:00" }, { route: "970", time: "14:15" },
      { route: "384", time: "14:30" }, { route: "970", time: "14:45" },
      { route: "389", time: "15:00" }, { route: "970", time: "15:15" },
      { route: "386", time: "15:30" }, { route: "970", time: "15:45" },
      { route: "388", time: "16:00" }, { route: "970", time: "16:15" },
      { route: "384", time: "16:30" }, { route: "970", time: "16:45" },
      { route: "389", time: "17:00" }, { route: "970", time: "17:15" },
      { route: "386", time: "17:30" }, { route: "970", time: "17:45" },
      { route: "388", time: "18:00" }, { route: "970", time: "18:15" },
      { route: "384", time: "18:30" }, { route: "970", time: "18:45" },
      { route: "389", time: "19:00" }, { route: "970", time: "19:30" },
      { route: "386", time: "20:00" }, { route: "970", time: "20:30" },
      { route: "388", time: "21:00" }, { route: "970", time: "21:30" },
      { route: "386", time: "22:00" }, { route: "970", time: "22:30" },
      { route: "970", time: "23:05" }, { route: "389", time: "23:15" },
      { route: "970", time: "23:30" }, { route: "386", time: "23:45" }
    ];

    let triggerFlipAnimation = false;

    function createSplitTile(text, targetLength, isBlue = false, padLeft = false) {
      const container = document.createElement('div');
      container.className = 'tile-group';
      
      let str = text.toString();
      if (targetLength && str.length < targetLength) {
        str = padLeft ? str.padStart(targetLength, ' ') : str.padEnd(targetLength, ' ');
      }
      
      str.split('').forEach(char => {
        const tile = document.createElement('div');
        tile.className = `tile-char ${isBlue ? 'tile-blue' : ''} ${triggerFlipAnimation ? 'flipping' : ''}`;
        tile.textContent = char;
        container.appendChild(tile);
      });
      return container;
    }

    function calculateArrival(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      let totalMins = h * 60 + m + 11;
      let arrH = Math.floor(totalMins / 60) % 24;
      let arrM = totalMins % 60;
      return `${String(arrH).padStart(2, '0')}:${String(arrM).padStart(2, '0')}`;
    }

    function formatEtaFixed(diffMinutes) {
      const hrs = Math.floor(diffMinutes / 60);
      const mins = diffMinutes % 60;
      const mStr = String(mins).padStart(2, '0') + 'm';
      
      if (hrs > 0) {
        return `${hrs}h${mStr}`;
      } else {
        return mStr;
      }
    }

    function decodeWmoCode(code) {
      if (code === 0) return { desc: "CLEAR", icon: "☀️" };
      if (code >= 1 && code <= 3) return { desc: "CLOUDY", icon: "⛅" };
      if (code >= 45 && code <= 48) return { desc: "FOG", icon: "🌫️" };
      if (code >= 51 && code <= 67) return { desc: "RAIN", icon: "🌧️" };
      if (code >= 80 && code <= 82) return { desc: "HEAVY RAIN", icon: "⛈️" };
      return { desc: "MILD", icon: "🌤️" };
    }

    async function fetchRealBOMWeather() {
      try {
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-31.95&longitude=115.86&hourly=temperature_2m,weather_code&timezone=Australia%2FPerth');
        const data = await response.json();
        
        const now = new Date();
        const currentHour = now.getHours();

        const periods = [
          { name: "NIGHT", repHour: 3 },
          { name: "MORNING", repHour: 9 },
          { name: "AFTERNOON", repHour: 15 },
          { name: "EVENING", repHour: 21 }
        ];

        let currentIndex = 0;
        if (currentHour >= 0 && currentHour < 6) currentIndex = 0;
        else if (currentHour >= 6 && currentHour < 12) currentIndex = 1;
        else if (currentHour >= 12 && currentHour < 18) currentIndex = 2;
        else currentIndex = 3;

        let dayOffset = 0;
        let lastPIndex = currentIndex;

        for (let i = 0; i < 4; i++) {
          let pIndex = (currentIndex + i) % 4;

          if (i > 0 && pIndex < lastPIndex) {
            dayOffset++;
          }
          lastPIndex = pIndex;

          let p = periods[pIndex];
          let apiHour = p.repHour + (dayOffset * 24);
          if (apiHour >= data.hourly.temperature_2m.length) {
            apiHour = p.repHour;
          }

          const temp = Math.round(data.hourly.temperature_2m[apiHour]);
          const weather = decodeWmoCode(data.hourly.weather_code[apiHour]);

          let labelText = dayOffset > 0 ? `TOMORROW ${p.name}` : `PERTH ${p.name}`;
          if (i === 0) {
            labelText = `PERTH ${p.name}`;
          }

          document.getElementById(`wlabel-${i}`).textContent = labelText;
          document.getElementById(`wval-${i}`).textContent = `${temp}°C • ${weather.desc}`;
          document.getElementById(`wicon-${i}`).textContent = weather.icon;
        }
      } catch (err) {
        console.log("Errore aggiornamento meteo:", err);
      }
    }

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

      const options = { weekday: 'long', day: '2-digit', month: 'short', year: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('en-GB', options).toUpperCase();
    }

    function renderTables() {
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      // INBOUND RENDER (6 CORSE)
      const inboundBody = document.getElementById('inbound-body');
      inboundBody.innerHTML = '';

      let upcomingInbound = inboundSchedules.map(timeStr => {
        const [h, m] = timeStr.split(':').map(Number);
        const busMinutes = h * 60 + m;
        return { timeStr, diff: busMinutes - currentMinutes, isTomorrow: false };
      }).filter(item => item.diff >= 0);

      if (upcomingInbound.length < 6) {
        const nextDayBuses = inboundSchedules.map(timeStr => {
          const [h, m] = timeStr.split(':').map(Number);
          const busMinutes = (24 * 60) + (h * 60 + m);
          return { timeStr, diff: busMinutes - currentMinutes, isTomorrow: true };
        });
        upcomingInbound = upcomingInbound.concat(nextDayBuses);
      }

      upcomingInbound.slice(0, 6).forEach((item, index) => {
        const row = document.createElement('tr');
        row.className = 'display-row';

        if (index === 0 && item.diff <= 10 && !item.isTomorrow) {
          row.classList.add('inbound-warning');
        }

        const tdRoute = document.createElement('td');
        tdRoute.appendChild(createSplitTile("970 ", 4, true));

        const tdDest = document.createElement('td');
        tdDest.appendChild(createSplitTile("PERTH BUSPORT", 13));

        const tdDep = document.createElement('td');
        tdDep.appendChild(createSplitTile(item.timeStr, 5));

        const tdArr = document.createElement('td');
        tdArr.appendChild(createSplitTile(calculateArrival(item.timeStr), 5));

        const tdEta = document.createElement('td');
        tdEta.style.textAlign = 'right';
        tdEta.appendChild(createSplitTile(formatEtaFixed(item.diff), 5, false, true));

        row.appendChild(tdRoute);
        row.appendChild(tdDest);
        row.appendChild(tdDep);
        row.appendChild(tdArr);
        row.appendChild(tdEta);
        inboundBody.appendChild(row);
      });

      // OUTBOUND RENDER (3 CORSE)
      const outboundBody = document.getElementById('outbound-body');
      outboundBody.innerHTML = '';

      let upcomingOutbound = outboundSchedules.map(item => {
        const [h, m] = item.time.split(':').map(Number);
        const busMinutes = h * 60 + m;
        return { ...item, diff: busMinutes - currentMinutes, isTomorrow: false };
      }).filter(item => item.diff >= 0);

      if (upcomingOutbound.length < 3) {
        const nextDayBuses = outboundSchedules.map(item => {
          const [h, m] = item.time.split(':').map(Number);
          const busMinutes = (24 * 60) + (h * 60 + m);
          return { ...item, diff: busMinutes - currentMinutes, isTomorrow: true };
        });
        upcomingOutbound = upcomingOutbound.concat(nextDayBuses);
      }

      upcomingOutbound.slice(0, 3).forEach((item) => {
        const row = document.createElement('tr');
        row.className = 'display-row';

        const tdRoute = document.createElement('td');
        let routeText = item.route.length === 3 ? item.route + ' ' : item.route;
        tdRoute.appendChild(createSplitTile(routeText, 4, true));

        const tdDest = document.createElement('td');
        let destText = (item.route === "970" || item.route === "970X") ? "HOME" : "DOG SWAMP";
        tdDest.appendChild(createSplitTile(destText, 9));

        const tdDep = document.createElement('td');
        tdDep.appendChild(createSplitTile(item.time, 5));

        const tdPlaceholder = document.createElement('td');

        const tdEta = document.createElement('td');
        tdEta.style.textAlign = 'right';
        tdEta.appendChild(createSplitTile(formatEtaFixed(item.diff), 5, false, true));

        row.appendChild(tdRoute);
        row.appendChild(tdDest);
        row.appendChild(tdDep);
        row.appendChild(tdPlaceholder);
        row.appendChild(tdEta);
        outboundBody.appendChild(row);
      });

      triggerFlipAnimation = false;
    }

    setInterval(() => {
      triggerFlipAnimation = true;
    }, 30000);

    setInterval(() => {
      updateClock();
      renderTables();
    }, 1000);

    setInterval(fetchRealBOMWeather, 900000);

    updateClock();
    renderTables();
    fetchRealBOMWeather();
  </script>
</body>
</html>
