<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transperth Split-Flap Display</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0e14;
      color: #e0e6ed;
      font-family: 'Courier New', Courier, monospace;
      padding: 15px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      user-select: none;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 8px;
      padding: 10px 20px;
      margin-bottom: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .header-right {
      text-align: right;
    }
    .weather-temp {
      font-size: 1.5rem;
      font-weight: bold;
      color: #58a6ff;
    }
    .clock {
      font-size: 2.2rem;
      font-weight: bold;
      color: #f5a623;
      letter-spacing: 2px;
    }
    .date {
      font-size: 0.9rem;
      color: #8b949e;
      text-transform: uppercase;
    }

    /* BOARDS */
    .board-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-grow: 1;
    }

    .panel {
      background: #11141a;
      border: 2px solid #21262d;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
    }

    .panel-inbound {
      flex: 1;
    }

    .panel-outbound {
      flex: 1.8; /* Doppio spazio per le uscite dal Busport */
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #8b949e;
      margin-bottom: 8px;
      letter-spacing: 1.5px;
      display: flex;
      justify-content: space-between;
    }

    /* TABLE LAYOUT */
    .display-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 6px;
    }

    .display-table th {
      text-align: left;
      font-size: 0.75rem;
      color: #6e7681;
      padding-bottom: 4px;
      letter-spacing: 1px;
    }

    .display-row {
      background: #161b22;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    /* EVIDENZIAZIONE ROSSA ENTRO 10 MINUTI */
    .display-row.warning-row {
      background: #3c1218 !important;
      border: 1px solid #da3633 !important;
    }
    .display-row.warning-row .tile-char {
      background: #5a1d22 !important;
      color: #ff7b72 !important;
      border-color: #8e292d !important;
    }

    /* STILE TESSERE GIREVOLI (SPLIT-FLAP RÉTRO) */
    .tile-group {
      display: inline-flex;
      gap: 3px;
      padding: 3px 0;
    }

    .tile-char {
      position: relative;
      background: #1c2128;
      color: #f5a623; /* Ambra Rétro */
      font-size: 1.25rem;
      font-weight: 800;
      width: 22px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      border: 1px solid #30363d;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.5);
      text-shadow: 0 0 2px rgba(245, 166, 35, 0.4);
    }

    /* Linea di incisione centrale meccano-digitale */
    .tile-char::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      background: rgba(0, 0, 0, 0.6);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .tile-blue {
      color: #58a6ff;
      text-shadow: 0 0 2px rgba(88, 166, 255, 0.4);
    }

    .col-route { width: 15%; }
    .col-dest { width: 45%; }
    .col-time { width: 20%; }
    .col-eta { width: 20%; text-align: right; }

  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="weather-temp">22°C ☀️</div>
      <div style="font-size: 0.8rem; color: #8b949e;">PERTH WA</div>
    </div>
    <div class="header-right">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="date">--- -- --- ----</div>
    </div>
  </div>

  <!-- MAIN BOARDS -->
  <div class="board-container">
    
    <!-- INBOUND PANEL -->
    <div class="panel panel-inbound">
      <div class="panel-title">
        <span>INBOUND / STOP 16812 (WILUNA ST)</span>
        <span style="color: #58a6ff;">TO PERTH BUSPORT</span>
      </div>
      <table class="display-table">
        <thead>
          <tr>
            <th class="col-route">BUS</th>
            <th class="col-dest">DESTINATION</th>
            <th class="col-time">ORARIO</th>
            <th class="col-eta" style="text-align: right;">ATTESA</th>
          </tr>
        </thead>
        <tbody id="inbound-body">
          <!-- Popolato via JS -->
        </tbody>
      </table>
    </div>

    <!-- OUTBOUND PANEL -->
    <div class="panel panel-outbound">
      <div class="panel-title">
        <span>OUTBOUND / FROM PERTH BUSPORT</span>
        <span style="color: #f5a623;">TO HOME (16813 / 12355)</span>
      </div>
      <table class="display-table">
        <thead>
          <tr>
            <th class="col-route">BUS</th>
            <th class="col-dest">DESTINATION</th>
            <th class="col-time">ORARIO</th>
            <th class="col-eta" style="text-align: right;">ATTESA</th>
          </tr>
        </thead>
        <tbody id="outbound-body">
          <!-- Popolato via JS -->
        </tbody>
      </table>
    </div>

  </div>

  <script>
    // --- TABELLE ORARIE UFFICIALI STATICHE ---
    // Inbound: Stop 16812 -> Perth Busport (Linea 970 / 970X)
    const inboundSchedules = [
      "05:42", "06:12", "06:32", "06:52", "07:12", "07:27", "07:42", "07:57",
      "08:12", "08:27", "08:42", "08:57", "09:12", "09:27", "09:42", "10:00",
      "10:15", "10:30", "10:45", "11:00", "11:15", "11:30", "11:45", "12:00",
      "12:15", "12:30", "12:45", "13:00", "13:15", "13:30", "13:45", "14:00",
      "14:15", "14:30", "14:45", "15:00", "15:15", "15:30", "15:45", "16:00",
      "16:15", "16:30", "16:45", "17:00", "17:15", "17:30", "17:45", "18:00",
      "18:20", "18:40", "19:00", "19:30", "20:00", "20:30", "21:30", "22:30"
    ];

    // Outbound: Perth Busport -> Stop 16813 / 12355 (Linee 384, 386, 388, 389, 970)
    const outboundSchedules = [
      { route: "389", time: "06:15" }, { route: "386", time: "06:30" },
      { route: "970", time: "06:45" }, { route: "388", time: "07:00" },
      { route: "384", time: "07:15" }, { route: "970", time: "07:30" },
      { route: "389", time: "07:45" }, { route: "386", time: "08:00" },
      { route: "970", time: "08:15" }, { route: "388", time: "08:30" },
      { route: "384", time: "08:45" }, { route: "970", time: "09:00" },
      { route: "389", time: "09:15" }, { route: "386", time: "09:30" },
      { route: "970", time: "09:45" }, { route: "388", time: "10:00" },
      { route: "970", time: "10:15" }, { route: "384", time: "10:30" },
      { route: "970", time: "10:45" }, { route: "389", time: "11:00" },
      { route: "970", time: "11:15" }, { route: "386", time: "11:30" },
      { route: "970", time: "11:45" }, { route: "388", time: "12:00" },
      { route: "970", time: "12:15" }, { route: "384", time: "12:30" },
      { route: "970", time: "12:45" }, { route: "389", time: "13:00" },
      { route: "970", time: "13:15" }, { route: "386", time: "13:30" },
      { route: "970", time: "13:45" }, { route: "388", time: "14:00" },
      { route: "970", time: "14:15" }, { route: "384", time: "14:30" },
      { route: "970", time: "14:45" }, { route: "389", time: "15:00" },
      { route: "970", time: "15:15" }, { route: "386", time: "15:30" },
      { route: "970", time: "15:45" }, { route: "388", time: "16:00" },
      { route: "970", time: "16:15" }, { route: "384", time: "16:30" },
      { route: "970", time: "16:45" }, { route: "389", time: "17:00" },
      { route: "970", time: "17:15" }, { route: "386", time: "17:30" },
      { route: "970", time: "17:45" }, { route: "388", time: "18:00" },
      { route: "970", time: "18:15" }, { route: "384", time: "18:30" },
      { route: "970", time: "18:45" }, { route: "389", time: "19:00" },
      { route: "970", time: "19:30" }, { route: "386", time: "20:00" },
      { route: "970", time: "20:30" }, { route: "388", time: "21:00" },
      { route: "970", time: "21:30" }, { route: "386", time: "22:00" },
      { route: "970", time: "22:30" }, { route: "389", time: "23:15" }
    ];

    function createSplitTile(text, isBlue = false) {
      const container = document.createElement('div');
      container.className = 'tile-group';
      
      text.toString().split('').forEach(char => {
        const tile = document.createElement('div');
        tile.className = `tile-char ${isBlue ? 'tile-blue' : ''}`;
        tile.textContent = char;
        container.appendChild(tile);
      });
      return container;
    }

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

      const options = { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' };
      document.getElementById('date').textContent = now.toLocaleDateString('en-GB', options).toUpperCase();
    }

    function renderTables() {
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      // INBOUND RENDER (Mostra le prossime 3 corse)
      const inboundBody = document.getElementById('inbound-body');
      inboundBody.innerHTML = '';
      
      const upcomingInbound = inboundSchedules.map(timeStr => {
        const [h, m] = timeStr.split(':').map(Number);
        const busMinutes = h * 60 + m;
        return { timeStr, diff: busMinutes - currentMinutes };
      }).filter(item => item.diff >= 0).slice(0, 3);

      upcomingInbound.forEach((item, index) => {
        const row = document.createElement('tr');
        row.className = 'display-row';

        // Evidenziazione rossa per la prima riga se <= 10 min
        if (index === 0 && item.diff <= 10) {
          row.classList.add('warning-row');
        }

        const tdRoute = document.createElement('td');
        tdRoute.appendChild(createSplitTile("970", true));

        const tdDest = document.createElement('td');
        tdDest.appendChild(createSplitTile("PERTH BUSPORT"));

        const tdTime = document.createElement('td');
        tdTime.appendChild(createSplitTile(item.timeStr));

        const tdEta = document.createElement('td');
        tdEta.style.textAlign = 'right';
        tdEta.appendChild(createSplitTile(`${item.diff}m`));

        row.appendChild(tdRoute);
        row.appendChild(tdDest);
        row.appendChild(tdTime);
        row.appendChild(tdEta);
        inboundBody.appendChild(row);
      });

      // OUTBOUND RENDER (Mostra le prossime 5 corse)
      const outboundBody = document.getElementById('outbound-body');
      outboundBody.innerHTML = '';

      const upcomingOutbound = outboundSchedules.map(item => {
        const [h, m] = item.time.split(':').map(Number);
        const busMinutes = h * 60 + m;
        return { ...item, diff: busMinutes - currentMinutes };
      }).filter(item => item.diff >= 0).slice(0, 5);

      upcomingOutbound.forEach((item, index) => {
        const row = document.createElement('tr');
        row.className = 'display-row';

        // Evidenziazione rossa per la prima riga se <= 10 min
        if (index === 0 && item.diff <= 10) {
          row.classList.add('warning-row');
        }

        const tdRoute = document.createElement('td');
        tdRoute.appendChild(createSplitTile(item.route, true));

        const tdDest = document.createElement('td');
        tdDest.appendChild(createSplitTile("DOG SWAMP / HOME"));

        const tdTime = document.createElement('td');
        tdTime.appendChild(createSplitTile(item.time));

        const tdEta = document.createElement('td');
        tdEta.style.textAlign = 'right';
        tdEta.appendChild(createSplitTile(`${item.diff}m`));

        row.appendChild(tdRoute);
        row.appendChild(tdDest);
        row.appendChild(tdTime);
        row.appendChild(tdEta);
        outboundBody.appendChild(row);
      });
    }

    // Inizializzazione e aggiornamento continuo ogni secondo
    setInterval(() => {
      updateClock();
      renderTables();
    }, 1000);

    updateClock();
    renderTables();
  </script>
</body>
</html>
